[program:mynine-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/APP_USER/data/www/mynine.uz
command=/opt/php82/bin/php /var/www/APP_USER/data/www/mynine.uz/artisan queue:work --sleep=3 --tries=3 --timeout=150 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=APP_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/APP_USER/data/www/mynine.uz/storage/logs/worker.log
stopwaitsecs=3600
environment=HOME="/var/www/APP_USER",PATH="/opt/php82/bin:/usr/bin:/bin:/usr/sbin:/sbin"
