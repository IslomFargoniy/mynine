[program:mynine-schedule]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/APP_USER/data/www/mynine.uz
command=/opt/php82/bin/php /var/www/APP_USER/data/www/mynine.uz/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=APP_USER
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/APP_USER/data/www/mynine.uz/storage/logs/schedule.log
stopwaitsecs=3600
environment=HOME="/var/www/APP_USER",PATH="/opt/php82/bin:/usr/bin:/bin:/usr/sbin:/sbin"
